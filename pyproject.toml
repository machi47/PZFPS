[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pzfps-harness"
version = "0.1.0"
description = "Reversible local harness for the first PZ Neural View experiment"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pzfps = "pzfps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
